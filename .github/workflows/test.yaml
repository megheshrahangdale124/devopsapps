name: java workflow
on: push
# branches:
#   - feat/cicd  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with maven
        run: mvn clean verify
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foodies
          path: target/*.war

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: display
        run: echo "Rushikesh Dagwal"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with maven
        run: mvn clean verify
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: build docker image
        run: docker image build -t ${{ secrets.DOCKER_USER_NAME }}/foodies:${{ github.run_number }} .
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_USER_PASS }}
      # - name: Push to DockerHub
      #   run: docker tag foodies:1.0 ${{ secrets.DOCKER_USER_NAME }}/foodies:1.0
      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USER_NAME }}/foodies:${{ github.run_number }}
    


