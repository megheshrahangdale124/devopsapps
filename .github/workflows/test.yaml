name: java workflow
on: push
# branches:
#   - feat/cicd  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with maven
        run: mvn clean verify
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foodies
          path: target/*.war

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: display
        run: echo "Rushikesh Dagwal"


